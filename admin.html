<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pak Point - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .admin-header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .admin-profile {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      border: 3px solid white;
      display: block;
      margin: 0 auto 10px;
    }

    .admin-header h1 {
      font-size: 27px;
    }

    .admin-header p {
      margin-top: 5px;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 18px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .login-btn {
      background: #dc2626;
      color: white;
      width: 100%;
    }

    .publish-btn {
      background: #16a34a;
      color: white;
      width: 100%;
    }

    .update-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .logout-btn {
      background: #374151;
      color: white;
      float: right;
      margin-top: 0;
    }

    .cancel-btn {
      background: #6b7280;
      color: white;
      margin-left: 8px;
    }

    .open-btn {
      background: #7c3aed;
      color: white;
    }

    .copy-btn {
      background: #0891b2;
      color: white;
    }

    .article-url {
      margin-top: 12px;
      padding: 10px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      word-break: break-all;
      color: #374151;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .article-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .article-item h3 {
      margin-bottom: 8px;
    }

    .article-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .article-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress {
      margin-top: 10px;
      font-size: 14px;
      color: #2563eb;
      font-weight: bold;
    }

    .topbar {
      overflow: hidden;
      margin-bottom: 20px;
    }

    .topbar h2 {
      display: inline-block;
      margin: 0;
      padding-top: 7px;
    }

    @media (max-width: 600px) {
      .admin-profile {
        width: 70px;
        height: 70px;
      }

      .admin-header h1 {
        font-size: 23px;
      }

      .topbar h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header class="admin-header">
  <img src="profile.jpg" alt="Admin Profile" class="admin-profile">
  <h1>PAK POINT</h1>
  <p>Admin Panel • News & Articles Management</p>
</header>

<div class="container">

  <div id="loginCard" class="card">
    <h2>Admin Login</h2>

    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter admin email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button class="login-btn" id="loginButton">Login</button>

    <div id="loginStatus" class="status"></div>
  </div>

  <div id="adminArea" class="hidden">

    <div class="card topbar">
      <button class="logout-btn" id="logoutButton">Logout</button>
      <h2>Admin Dashboard</h2>
    </div>

    <div class="card">

      <h2 id="formTitle">Publish New Article</h2>

      <label>Article Title</label>
      <input type="text" id="title" placeholder="Enter article title">

      <label>Category</label>
      <select id="category">
        <option value="Pakistan">Pakistan</option>
        <option value="World">World</option>
        <option value="Breaking News">Breaking News</option>
        <option value="Technology">Technology</option>
        <option value="Business">Business</option>
        <option value="Sports">Sports</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>

      <label>Short Description</label>
      <textarea id="description" placeholder="Write a short description..."></textarea>

      <label>Full Article</label>
      <textarea id="content" placeholder="Write the complete article here..."></textarea>

      <label>Article Image</label>
      <input type="file" id="imageFile" accept="image/*">

      <small style="display:block;margin-top:7px;color:#6b7280;">
        Recommended: JPG/PNG image up to 5 MB. The image is automatically compressed before saving.
      </small>

      <label>Article Video (Optional)</label>
      <input type="file" id="videoFile" accept="video/*">

      <div id="uploadProgress" class="progress"></div>

      <button class="publish-btn" id="publishButton">Publish Article</button>

      <button class="cancel-btn hidden" id="cancelEditButton">Cancel Edit</button>

      <div id="articleStatus" class="status"></div>

    </div>

    <div class="card">

      <h2>Published Articles</h2>

      <div id="articlesList">
        Loading articles...
      </div>

    </div>

  </div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  import {
    getStorage,
    ref,
    uploadBytesResumable,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDrjmV4GAHg2HPj_8961MPh1msjVU7dcdY",
    authDomain: "whatsapp-group-hub-2513a.firebaseapp.com",
    projectId: "whatsapp-group-hub-2513a",
    storageBucket: "whatsapp-group-hub-2513a.firebasestorage.app",
    messagingSenderId: "997714850617",
    appId: "1:997714850617:web:512eaa8131b882da25aee8",
    measurementId: "G-G3D7KLK9BM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  const ADMIN_EMAIL = "nk7741595@gmail.com";
  let editingArticleId = null;

  const loginCard = document.getElementById("loginCard");
  const adminArea = document.getElementById("adminArea");
  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");
  const loginStatus = document.getElementById("loginStatus");
  const articleStatus = document.getElementById("articleStatus");
  const publishButton = document.getElementById("publishButton");
  const cancelEditButton = document.getElementById("cancelEditButton");

  loginButton.addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginStatus.style.display = "block";
    loginStatus.className = "status";
    loginStatus.textContent = "Logging in...";

    if (!email || !password) {
      loginStatus.className = "status error";
      loginStatus.textContent = "Please enter email and password.";
      return;
    }

    try {

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      if (
        result.user.email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
      ) {

        await signOut(auth);

        throw new Error(
          "This account is not authorized as admin."
        );
      }

      loginStatus.className = "status success";
      loginStatus.textContent = "Login successful!";

    } catch (error) {

      console.error(error);

      loginStatus.className = "status error";
      loginStatus.textContent =
        error.message || "Login failed.";

    }

  });

  logoutButton.addEventListener("click", async () => {
    await signOut(auth);
  });

  onAuthStateChanged(auth, (user) => {

    if (
      user &&
      user.email &&
      user.email.toLowerCase()
      === ADMIN_EMAIL.toLowerCase()
    ) {

      loginCard.classList.add("hidden");
      adminArea.classList.remove("hidden");

      loadArticles();

    } else {

      loginCard.classList.remove("hidden");
      adminArea.classList.add("hidden");

    }

  });

  function uploadFile(file, folder) {

    return new Promise((resolve, reject) => {

      const fileName =
        Date.now() + "_" +
        Math.random().toString(36).substring(2) +
        "_" +
        file.name;

      const storageRef =
        ref(storage, `${folder}/${fileName}`);

      const uploadTask =
        uploadBytesResumable(storageRef, file);

      uploadTask.on(
        "state_changed",

        (snapshot) => {

          const percent =
            Math.round(
              (snapshot.bytesTransferred /
              snapshot.totalBytes) * 100
            );

          document.getElementById(
            "uploadProgress"
          ).textContent =
            `Uploading ${file.name}: ${percent}%`;

        },

        (error) => {
          reject(error);
        },

        async () => {

          const url =
            await getDownloadURL(
              uploadTask.snapshot.ref
            );

          resolve({
            url: url,
            path: uploadTask.snapshot.ref.fullPath
          });

        }
      );

    });

  }

  function prepareArticleImage(file) {

    return new Promise((resolve, reject) => {

      if (!file || !file.type.startsWith("image/")) {
        reject(new Error("Please select a valid image file."));
        return;
      }

      const reader = new FileReader();

      reader.onerror = () => {
        reject(new Error("Could not read the selected image."));
      };

      reader.onload = () => {

        const img = new Image();

        img.onerror = () => {
          reject(new Error("Could not process the selected image."));
        };

        img.onload = () => {

          const MAX_WIDTH = 1200;
          const MAX_HEIGHT = 800;

          let width = img.naturalWidth;
          let height = img.naturalHeight;

          const scale = Math.min(
            1,
            MAX_WIDTH / width,
            MAX_HEIGHT / height
          );

          width = Math.max(1, Math.round(width * scale));
          height = Math.max(1, Math.round(height * scale));

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          if (!ctx) {
            reject(new Error("Your browser cannot process this image."));
            return;
          }

          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);

          if (dataUrl.length > 900000) {
            reject(
              new Error(
                "Image is still too large after compression. Please choose a smaller image."
              )
            );
            return;
          }

          resolve({
            url: dataUrl,
            path: ""
          });

        };

        img.src = reader.result;

      };

      reader.readAsDataURL(file);

    });

  }

  publishButton.addEventListener(
    "click",
    async () => {

      const title =
        document.getElementById("title").value.trim();

      const category =
        document.getElementById("category").value;

      const description =
        document.getElementById("description").value.trim();

      const content =
        document.getElementById("content").value.trim();

      const imageFile =
        document.getElementById("imageFile").files[0];

      const videoFile =
        document.getElementById("videoFile").files[0];

      if (!title || !description || !content) {

        showArticleStatus(
          "Please fill title, short description and full article.",
          "error"
        );

        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = "Publishing...";

      document.getElementById(
        "uploadProgress"
      ).textContent = "";

      try {

        let imageData = null;
        let videoData = null;

        if (imageFile) {

          document.getElementById(
            "uploadProgress"
          ).textContent = "Processing article image...";

          imageData = await prepareArticleImage(imageFile);

          document.getElementById(
            "uploadProgress"
          ).textContent = "Article image ready.";

        }

        if (videoFile) {

          videoData =
            await uploadFile(
              videoFile,
              "articles/videos"
            );

        }

        const articleData = {

          title: title,
          category: category,
          description: description,
          content: content,
          status: "published",
          updatedAt: serverTimestamp()

        };

        if (imageData) {

          articleData.image =
            imageData.url;

          if (imageData.path) {
            articleData.imagePath = imageData.path;
          }

        }

        if (videoData) {

          articleData.video =
            videoData.url;

          articleData.videoPath =
            videoData.path;

        }

        if (!editingArticleId) {

          articleData.createdAt =
            serverTimestamp();

          await addDoc(
            collection(db, "articles"),
            articleData
          );

          showArticleStatus(
            "Article published successfully!",
            "success"
          );

        }

        else {

          await updateDoc(
            doc(
              db,
              "articles",
              editingArticleId
            ),
            articleData
          );

          showArticleStatus(
            "Article updated successfully!",
            "success"
          );

        }

        clearForm();

        await loadArticles();

      } catch (error) {

        console.error(error);

        showArticleStatus(
          error.message || "Something went wrong.",
          "error"
        );

      }

      publishButton.disabled = false;

      publishButton.textContent =
        editingArticleId
        ? "Update Article"
        : "Publish Article";

    }
  );

  async function loadArticles() {

    const list =
      document.getElementById("articlesList");

    list.innerHTML = "Loading articles...";

    try {

      const snapshot =
        await getDocs(
          collection(db, "articles")
        );

      if (snapshot.empty) {

        list.innerHTML =
          "<p>No articles found.</p>";

        return;

      }

      list.innerHTML = "";

      snapshot.forEach((articleDoc) => {

        const data = articleDoc.data();

        const item =
          document.createElement("div");

        item.className = "article-item";

        let html = `

          <h3>${escapeHtml(data.title || "")}</h3>

          <div class="article-meta">
            Category: ${escapeHtml(data.category || "")}
          </div>

          <p>
            ${escapeHtml(data.description || "")}
          </p>

        `;

        if (data.image) {

          html += `
            <img
              src="${data.image}"
              class="article-image"
              alt="Article Image"
            >
          `;

        }

        // Individual article URL
        const articleUrl =
          new URL(
            "article.html?id=" +
            encodeURIComponent(articleDoc.id),
            window.location.href
          ).href;

        html += `

          <div class="article-url">
            <strong>Article URL:</strong><br>
            <span>${escapeHtml(articleUrl)}</span>
          </div>

          <div class="button-row">

            <button
              class="open-btn"
              data-open="${escapeHtml(articleUrl)}"
            >
              Open Article
            </button>

            <button
              class="copy-btn"
              data-copy="${escapeHtml(articleUrl)}"
            >
              Copy URL
            </button>

            <button
              class="update-btn"
              data-edit="${articleDoc.id}"
            >
              Edit
            </button>

            <button
              class="delete-btn"
              data-delete="${articleDoc.id}"
            >
              Delete
            </button>

          </div>

        `;

        item.innerHTML = html;
        list.appendChild(item);

        item
          .querySelector("[data-open]")
          .addEventListener(
            "click",
            () => {
              window.location.href = articleUrl;
            }
          );

        item
          .querySelector("[data-copy]")
          .addEventListener(
            "click",
            async () => {
              try {
                await navigator.clipboard.writeText(articleUrl);
                showArticleStatus(
                  "Article URL copied successfully!",
                  "success"
                );
              } catch (error) {
                window.prompt(
                  "Copy this article URL:",
                  articleUrl
                );
              }
            }
          );

        item
          .querySelector("[data-edit]")
          .addEventListener(
            "click",
            () => editArticle(articleDoc.id)
          );

        item
          .querySelector("[data-delete]")
          .addEventListener(
            "click",
            () => deleteArticle(articleDoc.id)
          );

      });

    } catch (error) {

      console.error(error);

      list.innerHTML =
        `<p style="color:red;">
          ${escapeHtml(error.message)}
        </p>`;

    }

  }

  async function editArticle(id) {

    try {

      const snapshot =
        await getDocs(
          collection(db, "articles")
        );

      let data = null;

      snapshot.forEach((articleDoc) => {

        if (articleDoc.id === id) {
          data = articleDoc.data();
        }

      });

      if (!data) {

        alert("Article not found.");

        return;

      }

      editingArticleId = id;

      document.getElementById("title").value =
        data.title || "";

      document.getElementById("category").value =
        data.category || "Pakistan";

      document.getElementById("description").value =
        data.description || "";

      document.getElementById("content").value =
        data.content || "";

      document.getElementById(
        "formTitle"
      ).textContent =
        "Edit Article";

      publishButton.textContent =
        "Update Article";

      cancelEditButton.classList.remove(
        "hidden"
      );

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      alert(error.message);

    }

  }

  async function deleteArticle(id) {

    const confirmDelete =
      confirm(
        "Are you sure you want to delete this article?"
      );

    if (!confirmDelete) return;

    try {

      await deleteDoc(
        doc(db, "articles", id)
      );

      showArticleStatus(
        "Article deleted successfully.",
        "success"
      );

      await loadArticles();

    } catch (error) {

      showArticleStatus(
        error.message,
        "error"
      );

    }

  }

  cancelEditButton.addEventListener(
    "click",
    () => {
      clearForm();
    }
  );

  function clearForm() {

    editingArticleId = null;

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("content").value = "";

    document.getElementById("imageFile").value = "";
    document.getElementById("videoFile").value = "";

    document.getElementById("formTitle").textContent =
      "Publish New Article";

    publishButton.textContent =
      "Publish Article";

    cancelEditButton.classList.add(
      "hidden"
    );

    document.getElementById(
      "uploadProgress"
    ).textContent = "";

  }

  function showArticleStatus(message, type) {

    articleStatus.style.display = "block";

    articleStatus.className =
      "status " + type;

    articleStatus.textContent =
      message;

  }

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

</script>

</body>
</html>
