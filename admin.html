<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pak Point - Admin Panel</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    /* ADMIN HEADER */

    .admin-header {
      background: #111827;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .admin-profile {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      flex-shrink: 0;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 25px;
    }

    .admin-header p {
      margin: 5px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .login-btn,
    .publish-btn {
      background: #dc2626;
      color: white;
      width: 100%;
    }

    .logout-btn {
      background: #374151;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media (max-width: 600px) {

      .admin-header {
        padding: 15px;
      }

      .admin-profile {
        width: 60px;
        height: 60px;
      }

      .admin-header h1 {
        font-size: 21px;
      }

      .admin-header p {
        font-size: 12px;
      }

    }

  </style>
</head>

<body>

  <!-- ADMIN HEADER START -->

  <header class="admin-header">

    <img
      src="profile.jpg"
      alt="Admin"
      class="admin-profile"
    >

    <div>

      <h1>PAK POINT</h1>

      <p>
        Admin Panel • News & Articles Management
      </p>

    </div>

  </header>

  <!-- ADMIN HEADER END -->


  <div class="container">

    <div id="loginCard" class="card">

      <h2>Admin Login</h2>

      <label>Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
      >

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
      >

      <button
        class="login-btn"
        onclick="loginAdmin()"
      >
        Login
      </button>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

  </div>

</body>
</html>
