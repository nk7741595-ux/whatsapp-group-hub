<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pak Point - Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .admin-header {
      background: #111827;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    .admin-profile {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      border: 3px solid white;
      display: block;
      margin: 0 auto 10px;
    }

    .admin-header h1 {
      font-size: 27px;
    }

    .admin-header p {
      margin-top: 5px;
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 18px;
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-btn {
      background: #dc2626;
      color: white;
      width: 100%;
    }

    .otp-btn {
      background: #2563eb;
      color: white;
      width: 100%;
    }

    .publish-btn {
      background: #16a34a;
      color: white;
      width: 100%;
    }

    .update-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .logout-btn {
      background: #374151;
      color: white;
      float: right;
      margin-top: 0;
    }

    .cancel-btn {
      background: #6b7280;
      color: white;
      margin-left: 8px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .article-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }

    .article-item h3 {
      margin-bottom: 8px;
    }

    .article-meta {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .article-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 10px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress {
      margin-top: 10px;
      font-size: 14px;
      color: #2563eb;
      font-weight: bold;
    }

    .topbar {
      overflow: hidden;
      margin-bottom: 20px;
    }

    .topbar h2 {
      display: inline-block;
      margin: 0;
      padding-top: 7px;
    }

    .otp-info {
      background: #eff6ff;
      color: #1e40af;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .recaptcha-box {
      margin-top: 15px;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {

      .admin-profile {
        width: 70px;
        height: 70px;
      }

      .admin-header h1 {
        font-size: 23px;
      }

      .topbar h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header class="admin-header">

  <img
    src="profile.jpg"
    alt="Admin Profile"
    class="admin-profile"
  >

  <h1>PAK POINT</h1>

  <p>
    Admin Panel • News & Articles Management
  </p>

</header>


<div class="container">

  <!-- OTP LOGIN -->

  <div id="loginCard" class="card">

    <h2>
      Admin OTP Login
    </h2>

    <div class="otp-info">

      صرف رجسٹرڈ Admin نمبر پر OTP بھیجا جائے گا۔

    </div>


    <label>
      Mobile Number
    </label>

    <input
      type="tel"
      id="phoneNumber"
      value="+923313967373"
      readonly
    >


    <div
      id="recaptcha-container"
      class="recaptcha-box"
    ></div>


    <button
      class="otp-btn"
      id="sendOtpButton"
    >
      Send OTP
    </button>


    <div
      id="otpSection"
      class="hidden"
    >

      <label>
        Enter OTP
      </label>

      <input
        type="text"
        id="otpCode"
        placeholder="Enter 6 digit OTP"
        inputmode="numeric"
        maxlength="6"
      >

      <button
        class="login-btn"
        id="verifyOtpButton"
      >
        Verify OTP & Open Admin
      </button>

    </div>


    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>


  <!-- ADMIN AREA -->

  <div
    id="adminArea"
    class="hidden"
  >

    <div class="card topbar">

      <button
        class="logout-btn"
        id="logoutButton"
      >
        Logout
      </button>

      <h2>
        Admin Dashboard
      </h2>

    </div>


    <!-- ARTICLE FORM -->

    <div class="card">

      <h2 id="formTitle">
        Publish New Article
      </h2>


      <label>
        Article Title
      </label>

      <input
        type="text"
        id="title"
        placeholder="Enter article title"
      >


      <label>
        Category
      </label>

      <select id="category">

        <option value="Pakistan">
          Pakistan
        </option>

        <option value="World">
          World
        </option>

        <option value="Breaking News">
          Breaking News
        </option>

        <option value="Technology">
          Technology
        </option>

        <option value="Business">
          Business
        </option>

        <option value="Sports">
          Sports
        </option>

        <option value="Entertainment">
          Entertainment
        </option>

        <option value="Health">
          Health
        </option>

        <option value="Education">
          Education
        </option>

        <option value="Motivation">
          Motivation
        </option>

        <option value="Knowledge">
          Knowledge
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <label>
        Article Type
      </label>

      <select id="articleType">

        <option value="Article">
          Article
        </option>

        <option value="Story">
          Story
        </option>

      </select>


      <label>
        Short Description
      </label>

      <textarea
        id="description"
        placeholder="Write a short description..."
      ></textarea>


      <label>
        Full Article / Story
      </label>

      <textarea
        id="content"
        placeholder="Write the complete article or story here..."
      ></textarea>


      <label>
        Article Image
      </label>

      <input
        type="file"
        id="imageFile"
        accept="image/*"
      >


      <label>
        Article Video (Optional)
      </label>

      <input
        type="file"
        id="videoFile"
        accept="video/*"
      >


      <div
        id="uploadProgress"
        class="progress"
      ></div>


      <button
        class="publish-btn"
        id="publishButton"
      >
        Publish Article
      </button>


      <button
        class="cancel-btn hidden"
        id="cancelEditButton"
      >
        Cancel Edit
      </button>


      <div
        id="articleStatus"
        class="status"
      ></div>

    </div>


    <!-- ARTICLES LIST -->

    <div class="card">

      <h2>
        Published Articles
      </h2>

      <div id="articlesList">
        Loading articles...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    onAuthStateChanged,
    signOut
  }
  from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  }
  from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  import {
    getStorage,
    ref,
    uploadBytesResumable,
    getDownloadURL
  }
  from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


  /* FIREBASE CONFIG */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDrjmV4GAHg2HPj_8961MPh1msjVU7dcdY",

    authDomain:
      "whatsapp-group-hub-2513a.firebaseapp.com",

    projectId:
      "whatsapp-group-hub-2513a",

    storageBucket:
      "whatsapp-group-hub-2513a.firebasestorage.app",

    messagingSenderId:
      "997714850617",

    appId:
      "1:997714850617:web:512eaa8131b882da25aee8",

    measurementId:
      "G-G3D7KLK9BM"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const storage =
    getStorage(app);


  /* ADMIN PHONE */

  const ADMIN_PHONE =
    "+923313967373";


  let confirmationResult =
    null;


  let editingArticleId =
    null;


  /* ELEMENTS */

  const loginCard =
    document.getElementById(
      "loginCard"
    );


  const adminArea =
    document.getElementById(
      "adminArea"
    );


  const sendOtpButton =
    document.getElementById(
      "sendOtpButton"
    );


  const verifyOtpButton =
    document.getElementById(
      "verifyOtpButton"
    );


  const otpSection =
    document.getElementById(
      "otpSection"
    );


  const loginStatus =
    document.getElementById(
      "loginStatus"
    );


  const articleStatus =
    document.getElementById(
      "articleStatus"
    );


  const publishButton =
    document.getElementById(
      "publishButton"
    );


  const cancelEditButton =
    document.getElementById(
      "cancelEditButton"
    );


  /* RECAPTCHA */

  let recaptchaVerifier;


  function setupRecaptcha() {

    recaptchaVerifier =
      new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal"
        }
      );

  }


  setupRecaptcha();


  /* SEND OTP */

  sendOtpButton.addEventListener(
    "click",
    async () => {

      sendOtpButton.disabled =
        true;

      sendOtpButton.textContent =
        "Sending OTP...";


      loginStatus.style.display =
        "block";

      loginStatus.className =
        "status";

      loginStatus.textContent =
        "Sending OTP...";


      try {

        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            ADMIN_PHONE,
            recaptchaVerifier
          );


        otpSection.classList.remove(
          "hidden"
        );


        loginStatus.className =
          "status success";


        loginStatus.textContent =
          "OTP sent to your registered mobile number.";


        sendOtpButton.textContent =
          "OTP Sent";


      } catch (error) {

        console.error(error);


        loginStatus.className =
          "status error";


        loginStatus.textContent =
          getFirebaseError(
            error
          );


        sendOtpButton.disabled =
          false;


        sendOtpButton.textContent =
          "Send OTP";


        try {

          recaptchaVerifier.clear();

          setupRecaptcha();

        } catch (e) {}

      }

    }
  );


  /* VERIFY OTP */

  verifyOtpButton.addEventListener(
    "click",
    async () => {

      const code =
        document
          .getElementById(
            "otpCode"
          )
          .value
          .trim();


      if (!confirmationResult) {

        showLoginError(
          "Please request OTP first."
        );

        return;

      }


      if (
        !/^\d{6}$/.test(code)
      ) {

        showLoginError(
          "Please enter the 6 digit OTP."
        );

        return;

      }


      verifyOtpButton.disabled =
        true;

      verifyOtpButton.textContent =
        "Verifying...";


      try {

        const result =
          await confirmationResult.confirm(
            code
          );


        const user =
          result.user;


        /*
          IMPORTANT SECURITY CHECK:
          Only the specified phone number
          can access Admin Panel.
        */

        if (
          user.phoneNumber !==
          ADMIN_PHONE
        ) {

          await signOut(auth);

          throw new Error(
            "This phone number is not authorized for Admin Panel."
          );

        }


        loginStatus.className =
          "status success";


        loginStatus.textContent =
          "OTP verified successfully!";


        otpSection.classList.add(
          "hidden"
        );


      } catch (error) {

        console.error(error);


        loginStatus.className =
          "status error";


        loginStatus.textContent =
          getFirebaseError(
            error
          );


        verifyOtpButton.disabled =
          false;


        verifyOtpButton.textContent =
          "Verify OTP & Open Admin";

      }

    }
  );


  /* AUTH STATE */

  onAuthStateChanged(
    auth,
    (user) => {

      if (
        user &&
        user.phoneNumber ===
        ADMIN_PHONE
      ) {

        loginCard.classList.add(
          "hidden"
        );


        adminArea.classList.remove(
          "hidden"
        );


        loadArticles();

      } else {

        loginCard.classList.remove(
          "hidden"
        );


        adminArea.classList.add(
          "hidden"
        );

      }

    }
  );


  /* LOGOUT */

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await signOut(auth);

        location.reload();

      }
    );


  /* UPLOAD FILE */

  function uploadFile(
    file,
    folder
  ) {

    return new Promise(
      (resolve, reject) => {

        const fileName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2) +
          "_" +
          file.name;


        const storageRef =
          ref(
            storage,
            `${folder}/${fileName}`
          );


        const uploadTask =
          uploadBytesResumable(
            storageRef,
            file
          );


        uploadTask.on(

          "state_changed",

          (snapshot) => {

            const percent =
              Math.round(
                (
                  snapshot.bytesTransferred /
                  snapshot.totalBytes
                ) * 100
              );


            document
              .getElementById(
                "uploadProgress"
              )
              .textContent =
              `Uploading ${file.name}: ${percent}%`;

          },


          (error) => {

            reject(error);

          },


          async () => {

            const url =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            resolve({

              url: url,

              path:
                uploadTask
                  .snapshot
                  .ref
                  .fullPath

            });

          }

        );

      }
    );

  }


  /* PUBLISH / UPDATE */

  publishButton.addEventListener(
    "click",
    async () => {

      const title =
        document
          .getElementById(
            "title"
          )
          .value
          .trim();


      const category =
        document
          .getElementById(
            "category"
          )
          .value;


      const type =
        document
          .getElementById(
            "articleType"
          )
          .value;


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      const content =
        document
          .getElementById(
            "content"
          )
          .value
          .trim();


      const imageFile =
        document
          .getElementById(
            "imageFile"
          )
          .files[0];


      const videoFile =
        document
          .getElementById(
            "videoFile"
          )
          .files[0];


      if (
        !title ||
        !description ||
        !content
      ) {

        showArticleStatus(
          "Please fill title, description and full article.",
          "error"
        );

        return;

      }


      publishButton.disabled =
        true;


      publishButton.textContent =
        editingArticleId
        ? "Updating..."
        : "Publishing...";


      document
        .getElementById(
          "uploadProgress"
        )
        .textContent =
        "";


      try {

        let imageData =
          null;


        let videoData =
          null;


        if (imageFile) {

          imageData =
            await uploadFile(
              imageFile,
              "articles/images"
            );

        }


        if (videoFile) {

          videoData =
            await uploadFile(
              videoFile,
              "articles/videos"
            );

        }


        const articleData = {

          title:
            title,

          category:
            category,

          type:
            type,

          description:
            description,

          content:
            content,

          status:
            "published",

          updatedAt:
            serverTimestamp()

        };


        if (imageData) {

          articleData.image =
            imageData.url;

          articleData.imagePath =
            imageData.path;

        }


        if (videoData) {

          articleData.video =
            videoData.url;

          articleData.videoPath =
            videoData.path;

        }


        if (!editingArticleId) {

          articleData.createdAt =
            serverTimestamp();


          articleData.date =
            new Date()
              .toISOString();


          await addDoc(
            collection(
              db,
              "articles"
            ),
            articleData
          );


          showArticleStatus(
            "Article published successfully!",
            "success"
          );

        } else {

          await updateDoc(

            doc(
              db,
              "articles",
              editingArticleId
            ),

            articleData

          );


          showArticleStatus(
            "Article updated successfully!",
            "success"
          );

        }


        clearForm();

        await loadArticles();


      } catch (error) {

        console.error(error);


        showArticleStatus(
          error.message ||
          "Something went wrong.",
          "error"
        );

      }


      publishButton.disabled =
        false;


      publishButton.textContent =
        editingArticleId
        ? "Update Article"
        : "Publish Article";

    }
  );


  /* LOAD ARTICLES */

  async function loadArticles() {

    const list =
      document.getElementById(
        "articlesList"
      );


    list.innerHT
