<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Article | Pak Point</title>

  <meta name="description" content="Read the latest news and informative articles on Pak Point.">
  <meta name="robots" content="index, follow">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f3f4f6;
      color:#111827;
      line-height:1.7;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    /* TOP BAR */
    .topbar{
      background:#111827;
      color:#fff;
      text-align:center;
      padding:8px;
      font-size:13px;
    }

    /* HEADER */
    header{
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      position:sticky;
      top:0;
      z-index:20;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      padding:15px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .logo{
      font-size:28px;
      font-weight:800;
      color:#0f766e;
    }

    .logo span{
      color:#111827;
    }

    nav{
      display:flex;
      gap:18px;
      flex-wrap:wrap;
    }

    nav a{
      font-weight:600;
      font-size:14px;
      color:#374151;
    }

    nav a:hover{
      color:#0f766e;
    }

    /* BREAKING */
    .breaking{
      background:#0f766e;
      color:#fff;
    }

    .breaking-inner{
      max-width:1200px;
      margin:auto;
      padding:9px 20px;
      font-size:14px;
    }

    /* MAIN */
    .container{
      max-width:1000px;
      margin:auto;
      padding:30px 20px;
    }

    .article-box{
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #e5e7eb;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
    }

    .article-image{
      width:100%;
      max-height:550px;
      object-fit:cover;
      display:block;
      background:#e5e7eb;
    }

    .article-body{
      padding:30px;
    }

    .badge{
      display:inline-block;
      background:#0f766e;
      color:#fff;
      padding:5px 10px;
      border-radius:5px;
      font-size:12px;
      font-weight:bold;
      margin-bottom:12px;
    }

    .article-title{
      font-size:38px;
      line-height:1.25;
      margin-bottom:12px;
      color:#111827;
    }

    .article-meta{
      color:#0f766e;
      font-size:13px;
      font-weight:bold;
      margin-bottom:22px;
    }

    .description{
      font-size:18px;
      font-weight:600;
      color:#374151;
      margin-bottom:25px;
      padding-bottom:20px;
      border-bottom:1px solid #e5e7eb;
    }

    .content{
      font-size:17px;
      color:#1f2937;
      white-space:pre-wrap;
      word-wrap:break-word;
    }

    .content p{
      margin-bottom:18px;
    }

    .article-video{
      width:100%;
      max-height:600px;
      margin-top:25px;
      border-radius:10px;
      background:#000;
    }

    /* BACK BUTTON */
    .back{
      display:inline-block;
      margin-bottom:20px;
      background:#111827;
      color:#fff;
      padding:10px 18px;
      border-radius:7px;
      font-weight:bold;
      font-size:14px;
    }

    .back:hover{
      background:#0f766e;
    }

    /* ERROR */
    .message{
      background:#fff;
      padding:40px 25px;
      text-align:center;
      border-radius:12px;
      color:#6b7280;
    }

    .message h2{
      color:#111827;
      margin-bottom:10px;
    }

    /* FOOTER */
    footer{
      margin-top:45px;
      background:#111827;
      color:#d1d5db;
      padding:35px 20px;
      text-align:center;
    }

    footer a{
      color:#fff;
    }

    .contact{
      margin-top:10px;
    }

    /* MOBILE */
    @media(max-width:800px){

      .header-inner{
        flex-direction:column;
        align-items:flex-start;
      }

      nav{
        gap:10px;
      }

      .container{
        padding:20px 12px;
      }

      .article-body{
        padding:20px;
      }

      .article-title{
        font-size:28px;
      }

      .description{
        font-size:16px;
      }

      .content{
        font-size:16px;
      }

      .article-image{
        max-height:350px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    Pak Point — News, Information & Updates
  </div>

  <!-- HEADER -->
  <header>
    <div class="header-inner">

      <a class="logo" href="index.html">
        Pak <span>Point</span>
      </a>

      <nav>
        <a href="index.html">Home</a>

        <a href="index.html"
           onclick="saveCategory('Pakistan')">
          Pakistan
        </a>

        <a href="index.html"
           onclick="saveCategory('World')">
          World
        </a>

        <a href="index.html"
           onclick="saveCategory('Technology')">
          Technology
        </a>

        <a href="index.html"
           onclick="saveCategory('Lifestyle')">
          Lifestyle
        </a>

        <a href="index.html">
          All News
        </a>
      </nav>

    </div>
  </header>

  <!-- BREAKING -->
  <div class="breaking">
    <div class="breaking-inner">
      <strong>BREAKING:</strong>
      Latest important updates and news from Pak Point
    </div>
  </div>

  <!-- MAIN -->
  <main class="container">

    <a href="index.html" class="back">
      ← Back to Pak Point
    </a>

    <div id="articleContainer">

      <div class="message">
        <h2>Loading article...</h2>
        <p>Please wait.</p>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>

    <strong>© 2026 Pak Point</strong>

    <p>
      All rights reserved.
    </p>

    <div class="contact">

      <a
        href="https://wa.me/923397381786"
        target="_blank"
        rel="noopener">
        WhatsApp
      </a>

      &nbsp; | &nbsp;

      <a href="mailto:nk7741595@gmail.com">
        Email
      </a>

      &nbsp; | &nbsp;

      <a
        href="https://www.facebook.com/share/14jPJR3FZNZ/"
        target="_blank"
        rel="noopener">
        Facebook
      </a>

    </div>

  </footer>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* FIREBASE CONFIG */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDrjmV4GAHg2HPj_8961MPh1msjVU7dcdY",

      authDomain:
        "whatsapp-group-hub-2513a.firebaseapp.com",

      projectId:
        "whatsapp-group-hub-2513a",

      storageBucket:
        "whatsapp-group-hub-2513a.firebasestorage.app",

      messagingSenderId:
        "997714850617",

      appId:
        "1:997714850617:web:512eaa8131b882da25aee8",

      measurementId:
        "G-G3D7KLK9BM"
    };


    /* INITIALIZE FIREBASE */

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    /* DOM */

    const articleContainer =
      document.getElementById("articleContainer");


    /* HTML SECURITY */

    function escapeHTML(value = "") {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
    }


    /* DATE */

    function formatDate(value) {

      if (!value) return "";

      try {

        const date =
          value.toDate
            ? value.toDate()
            : new Date(value);

        return date.toLocaleDateString(
          "en-US",
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

      } catch {

        return "";
      }
    }


    /* IMAGE */

    function getImage(url) {

      if (
        url &&
        String(url).trim()
      ) {

        return String(url)
          .replaceAll('"', "&quot;");
      }

      return "";
    }


    /* GET ARTICLE ID */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const articleId =
      params.get("id");


    /* NO ID */

    if (!articleId) {

      articleContainer.innerHTML = `

        <div class="message">

          <h2>Article Not Found</h2>

          <p>
            No article ID was provided.
          </p>

          <br>

          <a href="index.html"
             class="back">
             Go to Homepage
          </a>

        </div>

      `;

    } else {

      loadArticle();

    }


    /* LOAD ARTICLE */

    async function loadArticle() {

      try {

        const articleRef =
          doc(
            db,
            "articles",
            articleId
          );

        const articleSnap =
          await getDoc(articleRef);


        /* ARTICLE DOES NOT EXIST */

        if (!articleSnap.exists()) {

          articleContainer.innerHTML = `

            <div class="message">

              <h2>Article Not Found</h2>

              <p>
                This article does not exist
                or has been removed.
              </p>

              <br>

              <a href="index.html"
                 class="back">
                 ← Back to Homepage
              </a>

            </div>

          `;

          return;
        }


        const article =
          articleSnap.data();


        /* ONLY PUBLISHED ARTICLES */

        if (article.status !== "published") {

          articleContainer.innerHTML = `

            <div class="message">

              <h2>Article Unavailable</h2>

              <p>
                This article is not currently
                available.
              </p>

              <br>

              <a href="index.html"
                 class="back">
                 ← Back to Homepage
              </a>

            </div>

          `;

          return;
        }


        /* DATA */

        const title =
          escapeHTML(
            article.title ||
            "Pak Point News"
          );

        const category =
          escapeHTML(
            article.category ||
            "News"
          );

        const description =
          escapeHTML(
            article.description ||
            ""
          );

        const content =
          escapeHTML(
            article.content ||
            "No article content available."
          );

        const date =
          formatDate(
            article.createdAt ||
            article.updatedAt
          );

        const image =
          getImage(article.image);

        const video =
          getImage(article.video);


        /* PAGE TITLE */

        document.title =
          (article.title || "Article") +
          " | Pak Point";


        /* DISPLAY ARTICLE */

        articleContainer.innerHTML = `

          <article class="article-box">

            ${
              image
              ?
              `
              <img
                class="article-image"
                src="${image}"
                alt="${title}"
                onerror="
                  this.style.display='none';
                "
              >
              `
              :
              ""
            }


            <div class="article-body">

              <span class="badge">
                ${category}
              </span>


              <h1 class="article-title">
                ${title}
              </h1>


              <div class="article-meta">

                Pak Point

                ${
                  date
                  ? " • " + escapeHTML(date)
                  : ""
                }

              </div>


              ${
                description
                ?
                `
                <div class="description">
                  ${description}
                </div>
                `
                :
                ""
              }


              <div class="content">
                ${content}
              </div>


              ${
                video
                ?
                `
                <video
                  class="article-video"
                  controls
                  preload="metadata"
                >

                  <source
                    src="${video}"
                  >

                  Your browser does not support
                  video playback.

                </video>
                `
                :
                ""
              }

            </div>

          </article>

        `;


      } catch (error) {

        console.error(
          "Article loading error:",
          error
        );


        articleContainer.innerHTML = `

          <div class="message">

            <h2>
              Article Load Error
            </h2>

            <p>
              Article load nahi ho saka.
            </p>

            <p>
              Firebase/Firestore settings
              check karein.
            </p>

            <br>

            <a href="index.html"
               class="back">
               ← Back to Homepage
            </a>

          </div>

        `;

      }

    }


    /* CATEGORY */

    window.saveCategory = function(category) {

      try {

        localStorage.setItem(
          "pakPointCategory",
          category
        );

      } catch (error) {

        console.log(error);

      }

    };

  </script>

</body>
    </html>
